<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Recruteur - SkillBadge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
                <div class="logo-icon"><i class="fas fa-building"></i></div>
                <span>Skill<span style="color: var(--primary-light);">Badge</span> Recruteur</span>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-sun"></i> <i class="fas fa-moon"></i>
                </div>
                <button class="logout-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i> Accueil
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div style="margin-bottom: 24px;">
            <h2>SkillBadge - Recruteurs</h2>
            <p style="color: var(--text-secondary);">Trouver des talents vérifiés sur blockchain</p>
        </div>

        <div class="grid-2">
            <!-- Recherche -->
            <div class="card">
                <h3><i class="fas fa-search"></i> Vérifier un candidat</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="text" id="candidateSearch" placeholder="Compétence, nom ou adresse..." style="flex: 1;">
                    <button class="btn-primary" style="width: auto;" onclick="verifyCandidate()"><i class="fas fa-check"></i> Vérifier</button>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0;">
                    <span class="badge-success filter-chip" onclick="filterBySkill('Tous')">Tous</span>
                    <span class="badge-success filter-chip" onclick="filterBySkill('React')">React</span>
                    <span class="badge-success filter-chip" onclick="filterBySkill('Flutter')">Flutter</span>
                    <span class="badge-success filter-chip" onclick="filterBySkill('UI/UX')">UI/UX</span>
                    <span class="badge-success filter-chip" onclick="filterBySkill('Data')">Data</span>
                </div>
                <div style="text-align: center; padding: 12px 0; border-top: 1px solid var(--border);">
                    <span class="badge-warning"><i class="fas fa-qrcode"></i> Scanner le QR du candidat</span>
                </div>
            </div>

            <!-- Résultats talents -->
            <div class="card">
                <h3><i class="fas fa-users"></i> Résultats (<span id="resultCount">24</span>)</h3>
                <input type="text" id="candidateFilter" placeholder="Filtrer par nom..." style="width:100%; padding:10px; border-radius:12px; margin-bottom:12px; background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary);" oninput="filterCandidates()">
                <div id="candidatesList"></div>
            </div>
        </div>

        <!-- Profil candidat détaillé -->
        <div class="card" id="candidateProfile" style="display: none; margin-bottom: 20px;">
            <div id="profileContent"></div>
            <div style="display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;">
                <button class="btn-primary" onclick="contactCandidate()"><i class="fas fa-envelope"></i> Contacter</button>
                <button class="btn-outline" onclick="shortlistCandidate()"><i class="fas fa-star"></i> Sauvegarder</button>
                <button class="btn-outline" onclick="exportCandidatePDF()"><i class="fas fa-download"></i> Exporter PDF</button>
            </div>
        </div>

        <!-- Mes candidatures suivies -->
        <div class="card">
            <h3><i class="fas fa-bookmark"></i> Mes candidatures suivies</h3>
            <div class="grid-2">
                <div>
                    <p style="color: var(--text-secondary); margin-bottom: 12px;">📁 <span id="shortlistCount">8</span> profils sauvegardés</p>
                    <div id="shortlistContainer"></div>
                </div>
                <div>
                    <button class="btn-outline" style="width:100%;" onclick="postOffer()"><i class="fas fa-plus"></i> Poster une offre</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
